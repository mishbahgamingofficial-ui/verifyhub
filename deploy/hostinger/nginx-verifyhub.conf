# VerifyHub — Nginx site for the Hostinger VPS.
# Install:
#   1. Replace YOURDOMAIN below with your real domain (2 places).
#   2. Copy to /etc/nginx/sites-available/verifyhub
#   3. sudo ln -s /etc/nginx/sites-available/verifyhub /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d YOURDOMAIN   (adds HTTPS; Telegram Mini Apps
#      REQUIRE https — http will not open inside Telegram)
#
# Everything (Mini App pages + /api/*) proxies to uvicorn on port 8000.

server {
    listen 80;
    server_name YOURDOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
}

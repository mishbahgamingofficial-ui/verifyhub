# VerifyHub — Render Blueprint.
# What this creates on Render:
#   1. verifyhub-db   — one shared PostgreSQL database (bot + API both use it)
#   2. verifyhub-api  — Web Service running the FastAPI API
#
# The Telegram bot runs INSIDE the API service via webhook
# (POST /telegram/webhook) — there is intentionally NO polling worker
# here. The user chose the free webhook route instead of the paid
# Starter worker (~$7/mo). Never run a polling worker while the webhook
# is registered — Telegram returns 409 conflicts and the bot goes silent.
# If a worker is ever added back, delete the webhook first.
#
# This file is set up for PLAN B (Hostinger SHARED hosting): the website
# files live on Hostinger (public_html) and the API runs here, because
# shared hosting cannot run a persistent FastAPI server. The Mini App
# points at this API with one line in frontend/config.js — see
# deploy/DEPLOY-GUIDE.md § 6.
#
# How to use:
#   1. Push this project to a GitHub repo.
#   2. Render dashboard → New → Blueprint → connect the repo.
#   3. Render asks for the sync:false values (BOT_TOKEN, REGISTRATION_URL,
#      ADMIN_TELEGRAM_IDS, TELEGRAM_WEBHOOK_SECRET). Fill them in — never
#      commit real secrets to git.
#   4. Deploy. Check the service Logs for startup messages.
#
# NOTE: always-on hosting on Render needs a paid plan. A free Web Service
# sleeps after ~15 min idle — the first Mini App open after a sleep takes
# ~50s to wake up, then works normally. Keep it warm with a free uptime
# monitor pinging /api/health every ~10 minutes, or upgrade to Starter.
# NOTE 2: the free database plan expires — Render deletes free databases
# unless upgraded. The live verifyhub-db is flagged to expire 5 Dec 2026;
# upgrade it (or migrate the data) before then.
# NOTE 3: the live services were created individually (not via this
# Blueprint), so this file is the reference topology — keep it in sync
# with what is actually live.

services:
  - type: web
    name: verifyhub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REGISTRATION_URL
        value: https://www.dmplay20.com/#/register?invitationCode=77254102278
      - key: MINI_APP_URL
        value: https://glaxfy.in/frontend/
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: verifyhub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      # Webhook mode (free tier): the Telegram bot runs inside this API
      # service via POST /telegram/webhook — no polling worker needed.
      # The live services were created individually (not via this
      # Blueprint), so also set these in the Render dashboard:
      #   TELEGRAM_WEBHOOK_SECRET — secret token, sync:false (generate one,
      #     never commit it)
      #   PUBLIC_BASE_URL — public URL of this API service, e.g.
      #     https://verifyhub-api-uyo8.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://verifyhub-api-uyo8.onrender.com

databases:
  - name: verifyhub-db
    plan: free
    # If Render no longer offers the free database plan, change to:
    # plan: starter

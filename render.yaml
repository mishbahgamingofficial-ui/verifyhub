# VerifyHub — Render Blueprint.
# What this creates on Render:
#   1. verifyhub-db   — one shared PostgreSQL database (bot + API both use it)
#   2. verifyhub-bot  — Background Worker running the Telegram bot (polling)
#   3. verifyhub-api  — Web Service running the FastAPI API
#
# This file is set up for PLAN B (Hostinger SHARED hosting): the website
# files live on Hostinger (public_html) and the API runs here, because
# shared hosting cannot run a persistent FastAPI server. The Mini App
# points at this API with one line in frontend/config.js — see
# deploy/DEPLOY-GUIDE.md § 6.
#
# If you are on Plan A (Hostinger VPS) instead, delete the verifyhub-api
# web service below — on a VPS the API runs on Hostinger itself and this
# file only needs the worker + database.
#
# How to use:
#   1. Push this project to a GitHub repo.
#   2. Render dashboard → New → Blueprint → connect the repo.
#   3. Render asks for the sync:false values (BOT_TOKEN, REGISTRATION_URL,
#      ADMIN_TELEGRAM_IDS). Fill them in — never commit real secrets to git.
#   4. Deploy. Check the service Logs for startup messages.
#
# NOTE: always-on hosting on Render needs a paid plan. A Background Worker
# needs Starter (~$7/mo) to stay online 24x7, and a free Web Service
# sleeps after ~15 min idle — the first Mini App open after a sleep takes
# ~50s to wake up, then works normally. The free tier has no always-on
# worker. If the bot/API must answer instantly at all hours, use the
# paid plans; check current prices on Render when you deploy.
# NOTE 2: only ONE process may poll a bot token. Never run the bot locally
# (python -m app.bot) while the Render worker is live — Telegram returns
# a 409 conflict and the bot goes silent.

services:
  - type: worker
    name: verifyhub-bot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-bot.txt
    startCommand: python -m app.bot
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        value: Testing_joinbot
      - key: MINI_APP_URL
        # Your Hostinger URL, e.g. https://glaxfy.in/frontend/
        # The bot's "Open Verification Panel" button opens this URL.
        value: https://glaxfy.in/frontend/
      - key: REGISTRATION_URL
        value: https://www.dmfirst0.com/#/register?invitationCode=497991806708
      - key: DATABASE_URL
        fromDatabase:
          name: verifyhub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: verifyhub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: REGISTRATION_URL
        value: https://www.dmfirst0.com/#/register?invitationCode=497991806708
      - key: MINI_APP_URL
        value: https://glaxfy.in/frontend/
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: verifyhub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
      # Webhook mode (free tier): the Telegram bot runs inside this API
      # service via POST /telegram/webhook — no polling worker needed.
      # The live services were created individually (not via this
      # Blueprint), so also set these in the Render dashboard:
      #   TELEGRAM_WEBHOOK_SECRET — secret token, sync:false (generate one,
      #     never commit it)
      #   PUBLIC_BASE_URL — public URL of this API service, e.g.
      #     https://verifyhub-api-uyo8.onrender.com
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://verifyhub-api-uyo8.onrender.com

databases:
  - name: verifyhub-db
    plan: free
    # If Render no longer offers the free database plan, change to:
    # plan: starter
